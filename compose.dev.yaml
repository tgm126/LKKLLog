name: lkkllog-dev

# Lokální vývoj: jen databáze v Dockeru, Django a Vite běží přímo na počítači.
#   docker compose -f compose.dev.yaml up -d
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: lkkllog
      POSTGRES_USER: lkkllog
      POSTGRES_PASSWORD: lkkllog
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dev-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lkkllog -d lkkllog"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dev-postgres:
