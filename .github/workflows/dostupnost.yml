# Hlídání dostupnosti zvenku: každé 2 hodiny přes den se zeptá aplikace, jestli běží.
# Když neodpoví, běh selže a GitHub pošle e-mail (stejně jako u neúspěšného CI).
# Časy jsou v UTC: 5–19 UTC = 7–21 h letního / 6–20 h zimního času. Mezi 23 a 6 h nikdy.
name: Dostupnost

on:
  schedule:
    - cron: "7 5,7,9,11,13,15,17,19 * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: https://lety.lkkl.cz/api/health
        run: |
          odpoved=$(curl --fail --silent --show-error --retry 3 --retry-delay 20 \
            --max-time 20 https://lety.lkkl.cz/api/health)
          echo "$odpoved"
          echo "$odpoved" | grep -q '"status": *"ok"'
