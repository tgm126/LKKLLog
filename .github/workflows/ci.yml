# Testy při každé změně; po sloučení do main se sestaví Docker image a uloží do GHCR.
# Nasazení na server se zapne proměnnou DEPLOY_ENABLED=true (viz deploy/NAVOD.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: lkkllog
          POSTGRES_USER: lkkllog
          POSTGRES_PASSWORD: lkkllog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lkkllog" --health-interval 5s --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://lkkllog:lkkllog@127.0.0.1:5432/lkkllog
      DJANGO_SECRET_KEY: ci-only
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: nazev
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.nazev.outputs.image }}:${{ github.sha }}
            ${{ steps.nazev.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      packages: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Nasazení na server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Server spustí jen deploy.sh; verzi předáme jako příkaz, token pro GHCR na vstup.
          printf '%s' "$TOKEN" | ssh lkkllog@"$HOST" "${{ github.sha }}"
