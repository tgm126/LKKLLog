# Testy při každé změně; po sloučení do main se otestovaná verze nasadí do VPS Centra.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: lkkllog
          POSTGRES_USER: lkkllog
          POSTGRES_PASSWORD: lkkllog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lkkllog" --health-interval 5s --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://lkkllog:lkkllog@127.0.0.1:5432/lkkllog
      DJANGO_SECRET_KEY: ci-only
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  image:
    # Kontrola, že se Docker image sestaví (na serveru ho sestavuje VPS Centrum).
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Otestovaná verze z main se pošle do git repozitáře ve VPS Centru,
    # které aplikaci samo sestaví a restartuje (migrace proběhnou při startu).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [image]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Nasazení do VPS Centra
        env:
          SSH_KEY: ${{ secrets.VPSC_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPSC_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # VPS Centrum je jen cíl nasazení – vždy přebírá přesně stav z GitHubu.
          git push --force             f84a5@one12.vas-server.cz:/git/f84a5/lkkllog-lkkl.cz.git HEAD:refs/heads/main
