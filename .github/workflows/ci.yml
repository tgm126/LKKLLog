# Běžný commit: rychlé testy (backend, frontend).
# Nasazení: značka verze (git tag v0.6.0) nebo ruční spuštění (Actions → CI → Run workflow)
# → navíc klikací testy, sestavení image a nasazení do VPS Centra.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: lkkllog
          POSTGRES_USER: lkkllog
          POSTGRES_PASSWORD: lkkllog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lkkllog" --health-interval 5s --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://lkkllog:lkkllog@127.0.0.1:5432/lkkllog
      DJANGO_SECRET_KEY: ci-only
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    # Klikací testy v prohlížeči (Playwright) proti zkušební kopii aplikace.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: lkkllog
          POSTGRES_USER: lkkllog
          POSTGRES_PASSWORD: lkkllog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lkkllog" --health-interval 5s --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://lkkllog:lkkllog@127.0.0.1:5432/lkkllog
      DJANGO_SECRET_KEY: ci-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Sestavení frontendu
        working-directory: frontend
        run: npm ci && npm run build
      - uses: astral-sh/setup-uv@v10.2.0
      - working-directory: backend
        run: uv sync --frozen
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('backend/uv.lock') }}
      - name: Prohlížeč Chromium
        working-directory: backend
        run: uv run playwright install --with-deps chromium
      - name: Klikací testy
        working-directory: backend
        run: >-
          uv run pytest e2e -q --video retain-on-failure --screenshot only-on-failure
          --output e2e-vysledky
      - name: Videa a snímky z neúspěšných testů
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-vysledky
          path: backend/e2e-vysledky
          retention-days: 7

  image:
    # Kontrola, že se Docker image sestaví (na serveru ho sestavuje VPS Centrum).
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Otestovaná verze z main se pošle do git repozitáře ve VPS Centru,
    # které aplikaci samo sestaví a restartuje (migrace proběhnou při startu).
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [image, e2e]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Nasazení do VPS Centra
        env:
          SSH_KEY: ${{ secrets.VPSC_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPSC_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Číslo verze do patičky aplikace (soubor VERZE jen v nasazeném kódu, ne na GitHubu).
          verze=$(git describe --tags --always)
          echo "$verze" > backend/VERZE
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -f backend/VERZE
          git commit -q -m "Nasazení $verze"
          # VPS Centrum je jen cíl nasazení – vždy přebírá přesně stav z GitHubu.
          git push --force             f84a5@one12.vas-server.cz:/git/f84a5/lkkllog-lkkl.cz.git HEAD:refs/heads/main
